name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: pokedex-vue/package-lock.json

      - name: Install dependencies
        working-directory: ./pokedex-vue
        run: npm ci

      - name: Lint
        working-directory: ./pokedex-vue
        run: npm run lint || true

      - name: Build
        working-directory: ./pokedex-vue
        run: npm run build

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install dependencies
        working-directory: ./pokedex-api
        run: |
          go mod download
          go mod verify

      - name: Run tests
        working-directory: ./pokedex-api
        run: go test -v ./...

      - name: Build
        working-directory: ./pokedex-api
        run: go build -v ./...

  deploy-frontend:
    name: Deploy Frontend to GitHub Pages
    needs: [test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: pokedex-vue/package-lock.json

      - name: Install dependencies
        working-directory: ./pokedex-vue
        run: npm ci

      - name: Build
        working-directory: ./pokedex-vue
        run: npm run build
        env:
          NODE_ENV: production

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./pokedex-vue/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
