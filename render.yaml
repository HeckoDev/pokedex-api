services:
  - type: web
    name: pokedex-api
    env: go
    buildCommand: go build -o main .
    startCommand: ./main
    envVars:
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: POSTGRES_PORT
        value: 5432
      - key: JWT_SECRET
        generateValue: true
      - key: GIN_MODE
        value: release
      - key: API_PORT
        value: 8080

databases:
  - name: pokedex-db
    databaseName: pokedex
    user: pokedex_user
